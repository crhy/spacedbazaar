name: Bug Report
description: Report an issue about using SpacedBazaar
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report!

  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. If you are reporting a crash please take a look at https://github.com/bazaar-org/bazaar/blob/debug-symbols/docs/debugging.md#debugging-crashes
      placeholder: Tell us what happened!
      value: "When I entered 2 + 2, I got the answer 6."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      description: Operating system (and desktop environment)
      placeholder: <os> <version>, <desktop> <version>
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version
      description: |
        Please check the current version of SpacedBazaar (Main Window > About SpacedBazaar) so we can more easily identify issues.
        Include the output of `flatpak info io.github.crhy.SpacedBazaar`.
    validations:
      required: true

  - type: textarea
    id: flatpak-remotes
    attributes:
      label: Configured Flatpak Remotes
      description: |
        Currently there are issues with user remotes.
        Please run `flatpak remotes`.
      placeholder: |
        Name                       Options
        flathub                    system
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: |
        If you are reporting performance issues or crashes then please fill this out.
      placeholder: |
        CPU: Ryzen 5 7600
        GPU: RX 6750 XT
        RAM: 16GB
    validations:
      required: false

  - type: textarea
    id: extra-context
    attributes:
      label: Extra information or context
      description: Add any other context about the problem here.
