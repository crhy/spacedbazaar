on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/*"
      - "screenshots/*"
      - "translators.sh"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

name: CI Build Flatpak
jobs:

  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-latest

    runs-on: ${{ matrix.variant.runner }}
    steps:

    - name: Git Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: recursive
        persist-credentials: false

    - name: Restore cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .flatpak-builder
        key: flatpak-builder-046f9ec-${{ matrix.variant.arch }}-${{ github.run_id }}
        restore-keys: |
          flatpak-builder-046f9ec-${{ matrix.variant.arch }}-

    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
      with:
        manifest-path: build-aux/flatpak/io.github.crhy.SpacedBazaar.json
        branch: master
        repo-dir: spaced-bazaar-repo
        build-bundle: false
        upload-artifact: false
        repository-name: flathub
        repository-url: https://flathub.org/repo/flathub.flatpakrepo
        # caching is broken upstream
        # https://github.com/flatpak/flatpak-github-actions/issues/239
        # this is only true because there is no other way to call fb with --ccache
        cache: true
        restore-cache: false
        arch: ${{ matrix.variant.arch }}
        verbose: true

    # The upstream action only sets --runtime-repo when it creates a bundle.
    # Build it explicitly so a direct install records the updateable Spaced
    # GitHub repository as the application source as well.
    - name: Create updateable release bundle
      env:
        BUNDLE: SpacedBazaar-${{ matrix.variant.arch }}.flatpak
      run: >-
        flatpak build-bundle
        --arch=${{ matrix.variant.arch }}
        --repo-url=https://crhy.github.io/spacedbazaar/flatpak-repo/
        --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
        spaced-bazaar-repo
        "$BUNDLE"
        io.github.crhy.SpacedBazaar
        master

    - name: Upload release bundle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: SpacedBazaar-${{ matrix.variant.arch }}.flatpak
        path: SpacedBazaar-${{ matrix.variant.arch }}.flatpak
        if-no-files-found: error
        compression-level: 0

    - name: Write new cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .flatpak-builder
        key: flatpak-builder-046f9ec-${{ matrix.variant.arch }}-${{ github.run_id }}

  release:
    name: "GitHub Release"
    if: startsWith(github.ref, 'refs/tags/')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(./version.sh get-version)"

      - name: Download Flatpak bundles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: SpacedBazaar-*.flatpak
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/SpacedBazaar-*.flatpak
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "SpacedBazaar $GITHUB_REF_NAME"
          --generate-notes
